<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>网易MC皮肤提取工具</title>
<style>
:root {
  --bg: #F2F4F7;
  --bg2: #E9EDF2;
  --bg3: #FFFFFF;
  --card: #FFFFFF;
  --card-h: #FDFDFF;
  --line: #E3E8EF;
  --txt: #1F2733;
  --sub: #5E6B7E;
  --green: #3DA55D;
  --green-l: #58C26F;
  --gold: #B7791F;
  --radius: 14px;
  --t-micro: 140ms;
  --t-instant: 90ms;
  --t-state: 240ms;
  --t-enter: 520ms;
  --t-trans: 380ms;
  --e-out: cubic-bezier(0.22,1,0.36,1);
  --e-std: cubic-bezier(0.4,0,0.2,1);
  --e-in: cubic-bezier(0.55,0,0.55,0.2);
  --e-spring: cubic-bezier(0.34,1.56,0.64,1);
  --d-long: 18px;
}
* { margin:0; padding:0; box-sizing:border-box; }
html, body { height:100%; }
body {
  font-family: "Segoe UI", "Microsoft YaHei UI", "Microsoft YaHei", system-ui, sans-serif;
  background:
    radial-gradient(900px 400px at 8% 0%, rgba(56,178,94,.07), transparent 55%),
    radial-gradient(900px 400px at 92% 0%, rgba(74,111,200,.08), transparent 55%),
    var(--bg);
  color: var(--txt);
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
button, .card { will-change: transform, opacity; }

#splash {
  position:fixed; inset:0; z-index:1000;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  background: radial-gradient(700px 360px at 50% 30%, rgba(56,178,94,.12), transparent 60%), var(--bg);
  opacity:1;
}
#splash .logo {
  width:96px; height:96px; border-radius:22px;
  background: #FFFFFF;
  border:1px solid rgba(56,178,94,.30);
  display:flex; align-items:center; justify-content:center;
  overflow:hidden;
  box-shadow: 0 14px 44px rgba(31,60,42,.16);
  animation: splashSlideUp var(--t-enter) var(--e-out) both;
}
#splash .logo img { width:88px; height:88px; object-fit:contain; }
@keyframes splashSlideUp {
  from { opacity:0; transform: translateY(var(--d-long)) scale(.92); }
  to   { opacity:1; transform: translateY(0) scale(1); }
}
#splash h1 {
  margin-top:18px; font-size:22px; font-weight:700; letter-spacing:.5px;
  animation: splashSlideUp var(--t-enter) var(--e-out) .06s both;
}
#splash .sub {
  margin-top:8px; font-size:13px; color:var(--sub);
  animation: splashSlideUp var(--t-enter) var(--e-out) .12s both;
}
#splash .ferris {
  margin-top:22px; width:34px; height:34px; border-radius:50%;
  border:3px solid rgba(126,217,87,.18);
  border-top-color: var(--green-l);
  animation: ferris 1s linear infinite;
}
@keyframes ferris { to { transform: rotate(360deg); } }
#splash.exit { animation: splashExit 320ms var(--e-in) forwards; }
@keyframes splashExit { to { opacity:0; transform: scale(1.03); } }

#app { height:100%; display:flex; flex-direction:column; opacity:0; }
#app.ready { animation: appIn var(--t-enter) var(--e-out) both; }
@keyframes appIn { from { opacity:0; transform: translateY(10px);} to { opacity:1; transform:none;} }

header {
  display:flex; align-items:center; gap:14px;
  padding:16px 22px 12px;
  animation: fadeInRight var(--t-enter) var(--e-out) .1s both;
}
@keyframes fadeInRight { from { opacity:0; transform: translateX(16px);} to {opacity:1; transform:none;} }
header .brand { display:flex; align-items:center; gap:12px; }
header .brand .cube {
  width:40px; height:40px; border-radius:10px;
  background: #FFFFFF;
  border:1px solid rgba(56,178,94,.30);
  display:flex; align-items:center; justify-content:center;
  overflow:hidden;
  box-shadow: 0 4px 14px rgba(31,60,42,.10);
}
header .brand .cube img { width:36px; height:36px; object-fit:contain; }
header .brand h1 { font-size:17px; font-weight:700; letter-spacing:.3px; }
header .brand p { font-size:11px; color:var(--sub); margin-top:2px; }
#state {
  margin-left:auto; display:flex; align-items:center; gap:8px;
  font-size:12px; color:var(--sub);
  background:var(--bg3); border:1px solid var(--line);
  padding:6px 14px; border-radius:999px;
}
#state .dot { width:8px; height:8px; border-radius:50%; background:var(--green); opacity:.9; }
#state.busy .dot { animation: dotPulse 1.2s ease-in-out infinite; }
@keyframes dotPulse { 50% { opacity:.25; transform: scale(.7);} }

.toolbar {
  display:flex; align-items:center; gap:10px;
  padding:6px 22px 12px;
  flex-wrap:wrap;
  animation: fadeInRight var(--t-enter) var(--e-out) .16s both;
}
.btn {
  display:inline-flex; align-items:center; gap:8px;
  border:none; cursor:pointer;
  font-family:inherit; font-size:13px; font-weight:600;
  color:var(--txt);
  padding:10px 18px; border-radius:10px;
  background:var(--bg3); border:1px solid var(--line);
  transition: transform var(--t-micro) var(--e-std), opacity var(--t-instant) linear,
              box-shadow var(--t-micro) var(--e-std), filter var(--t-micro) var(--e-std);
}
.btn:hover  { transform: translateY(-2px); filter: brightness(1.18); box-shadow: 0 6px 18px rgba(0,0,0,.35); }
.btn:active { transform: scale(.94); transition-duration: var(--t-instant); }
.btn:disabled { opacity:.45; cursor:default; transform:none; filter:none; }
.btn.primary { background: linear-gradient(145deg, #2E8A4C, #256E3C); border-color: rgba(126,217,87,.35); }
.btn .spin {
  width:14px; height:14px; border-radius:50%;
  border:2px solid rgba(255,255,255,.25); border-top-color:#fff;
  display:none; animation: ferris .9s linear infinite;
}
.btn.loading .spin { display:inline-block; }

main { flex:1; overflow-y:auto; padding:2px 22px 16px; scroll-behavior:smooth; }
main::-webkit-scrollbar { width:10px; }
main::-webkit-scrollbar-thumb { background:#C9D2DE; border-radius:6px; }
main::-webkit-scrollbar-thumb:hover { background:#A9B6C8; }
#list { display:flex; flex-direction:column; gap:8px; padding-bottom:10px; }

.card {
  display:flex; align-items:center; gap:14px;
  background:var(--card); border:1px solid var(--line);
  border-radius:var(--radius);
  padding:10px 14px;
  opacity:0;
  transition: transform var(--t-micro) var(--e-std), box-shadow var(--t-micro) var(--e-std),
              border-color var(--t-micro) var(--e-std);
}
.card:hover {
  transform: translateY(-4px);
  box-shadow: 0 10px 26px rgba(0,0,0,.4);
  background:var(--card-h);
}
.card.enter { animation: cardIn var(--t-enter) var(--e-out) both; animation-delay: var(--dly); }
@keyframes cardIn {
  from { opacity:0; transform: translateY(14px) scale(.985); }
  to   { opacity:1; transform:none; }
}
.card .thumb {
  width:62px; height:62px; border-radius:9px;
  background:#F4F6F9; border:1px solid var(--line);
  display:flex; align-items:center; justify-content:center;
  overflow:hidden; flex-shrink:0;
  image-rendering: pixelated;
}
.card .thumb img { width:100%; height:100%; object-fit:contain; }
.card .info { flex:1; min-width:0; }
.card .info .name {
  font-size:13.5px; font-weight:600; color:var(--txt);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.card .info .src { font-size:11.5px; color:var(--sub); margin-top:4px; }
.card .info .src.warn { color:var(--gold); }
.card .dl {
  border:none; cursor:pointer; font-family:inherit;
  font-size:12.5px; font-weight:700; color:#fff;
  background: linear-gradient(145deg, #2E8A4C, #256E3C);
  padding:9px 16px; border-radius:9px;
  flex-shrink:0;
  transition: transform var(--t-micro) var(--e-std), filter var(--t-micro) var(--e-std), box-shadow var(--t-micro) var(--e-std);
}
.card .dl:hover  { transform: translateY(-2px); filter:brightness(1.15); box-shadow:0 6px 16px rgba(63,168,92,.35); }
.card .dl:active { transform: scale(.92); transition-duration: var(--t-instant); }
.card .dl.ok { background: linear-gradient(145deg, #1F6E3A, #18532C); }
.card .dl.ok::after { content:" ✓"; }

#empty {
  display:flex; flex-direction:column; align-items:center; gap:10px;
  padding:70px 0; color:var(--sub); font-size:13.5px;
}
#empty .icon { font-size:44px; opacity:.5; animation: floatY 3s ease-in-out infinite; }
@keyframes floatY { 50% { transform: translateY(-8px);} }

footer {
  display:flex; align-items:center; gap:10px;
  padding:10px 22px;
  border-top:1px solid var(--line);
  font-size:11.5px; color:var(--sub);
  animation: fadeInRight var(--t-enter) var(--e-out) .2s both;
}
footer .cnt { color:var(--green-l); font-weight:700; }

#toasts { position:fixed; bottom:74px; left:50%; transform:translateX(-50%); z-index:900;
          display:flex; flex-direction:column; gap:8px; align-items:center; }
.toast {
  padding:12px 22px; border-radius:10px;
  font-size:13px; font-weight:600; color:#fff;
  box-shadow:0 10px 30px rgba(0,0,0,.4);
  animation: toastIn var(--t-state) var(--e-spring) both;
}
.toast.ok    { background: linear-gradient(145deg,#2E8A4C,#256E3C); }
.toast.err   { background: linear-gradient(145deg,#C24F47,#9C3832); }
.toast.leave { animation: toastOut var(--t-state) var(--e-in) forwards; }
@keyframes toastIn  { from { opacity:0; transform: translateY(16px) scale(.9);} to {opacity:1; transform:none;} }
@keyframes toastOut { to   { opacity:0; transform: translateY(10px) scale(.96);} }

#mask {
  position:fixed; inset:0; z-index:800; background:rgba(23,32,48,.38);
  display:none; align-items:center; justify-content:center;
  backdrop-filter: blur(4px);
}
#mask.show { display:flex; animation: maskIn var(--t-state) linear both; }
@keyframes maskIn { from { opacity:0; } }
.modal {
  width:460px; max-width:92vw;
  background:#FFFFFF;
  border:1px solid var(--line); border-radius:16px;
  padding:24px;
  box-shadow:0 24px 60px rgba(31,60,42,.16);
}
#mask.show .modal { animation: modalIn var(--t-trans) var(--e-spring) both; }
@keyframes modalIn { from { opacity:0; transform: translateY(18px) scale(.94);} to {opacity:1; transform:none;} }
.modal h2 { font-size:16px; margin-bottom:4px; }
.modal .tip { font-size:11.5px; color:var(--sub); margin-bottom:14px; line-height:1.6; }
.modal label { display:block; font-size:12px; color:var(--sub); margin:12px 0 6px; }
.modal .actions { display:flex; justify-content:flex-end; gap:10px; margin-top:18px; }
.modal .dirrow { display:flex; align-items:center; gap:10px; }
.modal .dirpath {
  flex:1; min-width:0;
  padding:10px 12px; border-radius:9px;
  background:var(--bg2); border:1px solid var(--line);
  font-size:12.5px; color:var(--txt);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
  }
}
</style>
</head>

      <div>
        <h1>网易MC皮肤提取工具</h1>
        <p>找到全部皮肤 · 一键下载到所选位置（供 Java 版使用）</p>
      </div>
    </div>
    <div id="state"><span class="dot"></span><span id="stateTxt">就绪</span></div>
  </header>

  <div class="toolbar">
    <button class="btn primary" id="btnScan">🔍 开始扫描</button>
    <button class="btn" id="btnFull">🌐 全盘搜索</button>
    <button class="btn danger" id="btnStop" style="display:none">⏹ 停止搜索</button>
    <button class="btn" id="btnSet">⚙ 设置</button>
  </div>

  <main id="main">
    <div id="empty"><div class="icon">🗂️</div><div>正在扫描皮肤…</div></div>
    <div id="list"></div>
  </main>

  <footer>
    <span>共 <span class="cnt" id="cnt">0</span> 个皮肤</span>
    <span style="opacity:.7">· 点击右侧「我要下载」保存到所选位置</span>
    <span style="margin-left:auto" id="desktopPath"></span>
  </footer>
</div>

<div id="toasts"></div>

<div id="mask">
  <div class="modal">
    <h2>⚙ 设置</h2>
    <div class="tip">选择皮肤下载后保存的位置，点「我要下载」即保存到所选文件夹。默认保存到桌面。</div>
    <label>下载位置</label>
    <div class="dirrow">
      <span class="dirpath" id="cfgDir">桌面</span>
      <button class="btn primary" id="chooseDir">选择文件夹…</button>
    </div>
    <div class="actions">
      <button class="btn" id="setClose">关闭</button>
    </div>
  </div>
</div>

<script>
"use strict";
const EASE = {
  out:    "cubic-bezier(0.22,1,0.36,1)",
  std:    "cubic-bezier(0.4,0,0.2,1)",
  spring: "cubic-bezier(0.34,1.56,0.64,1)",
};

function countUp(el, target, dur) {
  dur = dur || 600;
  const t0 = performance.now();
  function tick(t) {
    const k = Math.min(1, (t - t0) / dur);
    const e = 1 - Math.pow(1 - k, 3);
    el.textContent = Math.round(target * e);
    if (k < 1) requestAnimationFrame(tick);
    else el.textContent = target;
  }
  requestAnimationFrame(tick);
}

function toast(msg, ok) {
  const box = document.getElementById("toasts");
  const t = document.createElement("div");
  t.className = "toast " + (ok ? "ok" : "err");
  t.textContent = msg;
  box.appendChild(t);
  setTimeout(() => { t.classList.add("leave"); setTimeout(() => t.remove(), 340); }, 2200);
}

let busyStack = 0;
function setBusy(busy, txt) {
  const st = document.getElementById("state");
  const tt = document.getElementById("stateTxt");
  busyStack = Math.max(0, busyStack + (busy ? 1 : -1));
  st.classList.toggle("busy", busyStack > 0);
  if (txt) tt.textContent = txt;
  if (busyStack === 0) tt.textContent = "就绪";
}
function setState(txt) { document.getElementById("stateTxt").textContent = txt; }

let _api = null;
function getApi() {
  if (_api) return _api;
  if (window.pywebview && window.pywebview.api) { _api = window.pywebview.api; return _api; }
  return null;
}
let SKINS = [];

function renderList(items) {
  const list = document.getElementById("list");
  const empty = document.getElementById("empty");
  list.innerHTML = "";
  if (!items || !items.length) {
    empty.style.display = "flex";
    return;
  }
  empty.style.display = "none";
  countUp(document.getElementById("cnt"), items.length, 600);

  items.forEach((s, i) => {
    const card = document.createElement("div");
    card.className = "card";
    card.style.setProperty("--dly", (i * 40) + "ms");

    const thumb = document.createElement("div");
    thumb.className = "thumb";
    const img = document.createElement("img");
    img.src = s.thumb || "";
    img.alt = s.name;
    thumb.appendChild(img);

    const info = document.createElement("div");
    info.className = "info";
    const name = document.createElement("div");
    name.className = "name";
    name.textContent = s.name;
    const src = document.createElement("div");
    src.className = "src" + (s.isZip ? " warn" : "");
    src.textContent = s.source + " · " + fmtSize(s.size) + (s.isZip ? " · 4D包可能不适用Java版" : "");
    info.appendChild(name);
    info.appendChild(src);

    const dl = document.createElement("button");
    dl.className = "dl";
    dl.textContent = "我要下载";
    dl.addEventListener("click", () => downloadSkin(s, dl));

    card.appendChild(thumb);
    card.appendChild(info);
    card.appendChild(dl);
    list.appendChild(card);
    card.classList.add("enter");
  });
  observeCards();
}

function observeCards() {
  const cards = document.querySelectorAll(".card.enter");
  if (!("IntersectionObserver" in window)) return;
  const io = new IntersectionObserver((entries) => {
    entries.forEach(en => {
      if (en.isIntersecting) {
        en.target.style.animationDelay = "0ms";
        io.unobserve(en.target);
      }
    });
  }, { rootMargin: "0px 0px -10% 0px" });
  cards.forEach(c => io.observe(c));
}

function fmtSize(n) { return n >= 1024 ? (n/1024).toFixed(0) + "KB" : n + "B"; }

async function scan() {
  if (!getApi()) return toast("后端未就绪", false);
  setBusy(true, "扫描中…");
  document.getElementById("btnScan").classList.add("loading");
  let timer = setTimeout(() => {
    setBusy(false);
    document.getElementById("btnScan").classList.remove("loading");
    setState("扫描超时，请重试或使用全盘搜索");
    toast("扫描时间过长，已自动停止", false);
  }, 120000);
  try {
    const r = await getApi().scan();
    clearTimeout(timer);
    SKINS = r.items || [];
    renderList(SKINS);
    toast("扫描完成，找到 " + r.count + " 个皮肤", true);
    setState("扫描完成 · " + r.count + " 个皮肤");
  } catch (e) {
    clearTimeout(timer);
    toast("扫描失败：" + e, false);
    setState("扫描失败");
  } finally {
    clearTimeout(timer);
    setBusy(false);
    document.getElementById("btnScan").classList.remove("loading");
  }
}

async function fullScan() {
  if (!getApi()) return toast("后端未就绪", false);
  setBusy(true, "全盘搜索中…（较慢，可随时停止）");
  document.getElementById("btnFull").classList.add("loading");
  document.getElementById("btnFull").disabled = true;
  document.getElementById("btnStop").style.display = "inline-flex";
  window.__fullScanProgress = (p) => setState("全盘搜索中… " + p);
  try {
    const r = await getApi().full_scan();
    SKINS = r.items || [];
    renderList(SKINS);
    if (r.cancelled) {
      toast("已停止搜索，当前共 " + r.count + " 个皮肤", true);
      setState("全盘搜索已停止 · " + r.count + " 个皮肤");
    } else {
      toast("全盘搜索完成，新增 " + r.added + " 个候选", true);
      setState("全盘搜索完成 · " + r.count + " 个皮肤");
    }
  } catch (e) {
    toast("全盘搜索失败：" + e, false);
  } finally {
    setBusy(false);
    document.getElementById("btnFull").classList.remove("loading");
    document.getElementById("btnFull").disabled = false;
    document.getElementById("btnStop").style.display = "none";
    window.__fullScanProgress = null;
  }
}
document.getElementById("btnStop").addEventListener("click", () => {
  if (getApi()) getApi().cancel_full_scan();
});

async function downloadSkin(s, btn) {
  if (!getApi()) return;
  btn.disabled = true;
  try {
    const r = await getApi().download(s.path, s.name);
    if (r.ok) {
      btn.classList.add("ok");
      btn.textContent = "已下载";
      toast("✅ 已保存到：" + r.target, true);
    } else {
      btn.textContent = "下载失败";
      toast("下载失败：" + r.error, false);
      setTimeout(() => { btn.textContent = "我要下载"; btn.disabled = false; }, 1600);
      return;
    }
  } catch (e) {
    toast("下载失败：" + e, false);
    btn.textContent = "我要下载";
    btn.disabled = false;
  }
}

async function openSettings() {
  const mask = document.getElementById("mask");
  mask.classList.add("show");
  if (getApi()) {
    try {
      const s = await getApi().get_settings();
      document.getElementById("cfgDir").textContent = s.download_dir || "";
      document.getElementById("cfgDir").title = s.download_dir || "";
    } catch (e) {}
  }
}
function closeSettings() { document.getElementById("mask").classList.remove("show"); }
document.getElementById("setClose").addEventListener("click", closeSettings);
document.getElementById("chooseDir").addEventListener("click", async () => {
  if (!getApi()) return;
  const btn = document.getElementById("chooseDir");
  btn.disabled = true;
  try {
    const r = await getApi().choose_dir();
    if (r.ok) {
      document.getElementById("cfgDir").textContent = r.download_dir;
      document.getElementById("cfgDir").title = r.download_dir;
      document.getElementById("desktopPath").textContent = "下载位置：" + r.download_dir;
      toast("下载位置已设置为：" + r.download_dir, true);
    } else if (!r.cancel) {
      toast("设置失败：" + r.error, false);
    }
  } catch (e) {
    toast("设置失败：" + e, false);
  } finally {
    btn.disabled = false;
  }
});

document.getElementById("btnScan").addEventListener("click", scan);
document.getElementById("btnFull").addEventListener("click", fullScan);
document.getElementById("btnSet").addEventListener("click", openSettings);
document.getElementById("mask").addEventListener("click", (e) => { if (e.target.id === "mask") closeSettings(); });

async function bootstrap() {
  getApi();
  window.addEventListener("error", (e) => {
    setState("JS错误: " + e.message);
    console.error("JS error:", e.error);
  });
  window.addEventListener("unhandledrejection", (e) => {
    setState("API错误: " + (e.reason && e.reason.message ? e.reason.message : e.reason));
    console.error("API reject:", e.reason);
  });

  const dp = document.getElementById("desktopPath");
  if (getApi()) {
    try {
      const info = await getApi().app_info();
      dp.textContent = "下载位置：" + info.download_dir;
    } catch (e) {
      dp.textContent = "桥接异常：" + e;
    }
  } else {
    dp.textContent = "pywebview 桥接未注入";
    setState("桥接异常");
  }
  const sp = document.getElementById("splash");
  sp.classList.add("exit");
  setTimeout(() => sp.remove(), 340);
  document.getElementById("app").classList.add("ready");
  scan();
}

if (window.pywebview) {
  bootstrap();
} else {
  window.addEventListener("pywebviewready", bootstrap, { once: true });
  let n = 0;
  const t = setInterval(() => {
    n += 1;
    if (window.pywebview) { clearInterval(t); bootstrap(); }
    else if (n > 60) { clearInterval(t); bootstrap(); }
  }, 200);
}
</script>
</body>
</html>
