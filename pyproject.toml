[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "minecraft-skin-tool"
version = "1.0.0"
description = "把网易版《我的世界》皮肤一键导出为 Java 版可用"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
dependencies = [
    "pywebview>=5.0",
    "Pillow>=9.0",
]

[project.scripts]
mc-skin-tool = "main:main"

[tool.setuptools]
packages = ["core", "model", "app", "utils"]

[tool.setuptools.package-data]
app = ["ui.html"]
